<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-label="Typical floor key plan">
  <rect width="800" height="650" fill="#f4f1ea"/>
  <text x="40" y="36" font-family="Georgia, serif" font-size="22" fill="#1a1a1a">Building - Typical Floor Key Plan</text>
  <text x="40" y="58" font-family="system-ui,sans-serif" font-size="12" fill="#666">Corridor + unit stacking - Not to scale</text>
  <rect x="80" y="100" width="640" height="460" fill="#fff" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="330" y="280" width="140" height="120" fill="#e8eef0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333">LIFT</text>
  <text x="400" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333">LOBBY</text>
  <rect x="200" y="300" width="400" height="80" fill="#f0ebe3" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">CORRIDOR</text>
  <rect x="100" y="120" width="200" height="160" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#333">UNIT A</text>
  <rect x="500" y="120" width="200" height="160" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#333">UNIT B</text>
  <rect x="100" y="400" width="200" height="140" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#333">UNIT C</text>
  <rect x="500" y="400" width="200" height="140" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#333">UNIT D</text>
  <rect x="320" y="120" width="60" height="160" fill="#f7f3ec" stroke="#1a1a1a" stroke-width="2"/>
  <text x="350" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333" transform="rotate(-90 350 205)">STAIR</text>
  <rect x="420" y="120" width="60" height="160" fill="#f7f3ec" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333" transform="rotate(-90 450 205)">STAIR</text>
  <text x="400" y="610" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888">2% Company - Indicative key plan</text>
</svg>
